<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rikin Delight Bakery</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #fff7f0;
}

header {
    background: #8b4513;
    color: white;
    text-align: center;
    padding: 20px;
}

.container {
    padding: 30px;
}

.cakes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: white;
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    width: 220px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

button {
    background: #d2691e;
    color: white;
    padding: 10px;
    border: none;
    margin-top: 15px;
    cursor: pointer;
}

#orderSummary {
    margin-top: 30px;
    padding: 20px;
    background: #fff;
    border-radius: 10px;
}
</style>

</head>

<body>

<header>
<h1>Delight Bakery</h1>
<p>Choose your favorite cake</p>
</header>

<div class="container">

<div class="cakes">

<div class="card">
<img src="https://images.unsplash.com/photo-1605478580705-7b4d8b54a8b5" alt="Chocolate Cake">
<h3>Chocolate Cake</h3>
<p>Price: Rs 800</p>
<input type="checkbox" value="Chocolate Cake" data-price="800"> Select<br>
Qty: <input type="number" value="1" min="1">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1621303837174-89787a7d4729" alt="Strawberry Cake">
<h3>Strawberry Cake</h3>
<p>Price: Rs 900</p>
<input type="checkbox" value="Strawberry Cake" data-price="900"> Select<br>
Qty: <input type="number" value="1" min="1">
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587" alt="Vanilla Cake">
<h3>Vanilla Cake</h3>
<p>Price: Rs 700</p>
<input type="checkbox" value="Vanilla Cake" data-price="700"> Select<br>
Qty: <input type="number" value="1" min="1">
</div>

</div>

<button onclick="placeOrder()">Place Order</button>

<div id="orderSummary">
<h2>Order Summary</h2>
<p>No items selected</p>
</div>

</div>

<script>
function placeOrder() {
    let items = document.querySelectorAll('.card');
    let summary = "";
    let total = 0;

    items.forEach(card => {
        let checkbox = card.querySelector('input[type="checkbox"]');
        let qty = card.querySelector('input[type="number"]').value;

        if (checkbox.checked) {
            let price = checkbox.dataset.price;
            let itemTotal = price * qty;
            total += itemTotal;

            summary += checkbox.value + " x " + qty + " = Rs " + itemTotal + "<br>";
        }
    });

    if (summary === "") {
        summary = "No items selected";
    } else {
        summary += "<br><strong>Total: Rs " + total + "</strong>";
    }

    document.getElementById("orderSummary").innerHTML = "<h2>Order Summary</h2>" + summary;
}
</script>

</body>
</html>
